name: CI

# Catches a broken push before a host tries to build it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The search budget is a script that runs inside Redis, and a fake cannot
    # check a script. Its tests run against this one.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          REDIS_TEST_URL: redis://localhost:6379
      # No API keys here on purpose: the build must not need them. Anything
      # that reaches the network at build time is a bug this would catch.
      - run: npm run build
      # The build passing says nothing about whether the deployed functions
      # can run the models: they are loaded by dynamic import, which the
      # tracer cannot follow, and twice production shipped without part of
      # the runtime while everything here was green. This runs the models from
      # exactly the files each function ships.
      - run: npm run check:bundle
