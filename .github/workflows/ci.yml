name: CI

# Catches a broken push before a host tries to build it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # No API keys here on purpose: the build must not need them. Anything
      # that reaches the network at build time is a bug this would catch.
      - run: npm run build
